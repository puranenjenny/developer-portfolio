name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_PATH: /developer-portfolio/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro check
      - name: Subpath safety (builds with several base paths)
        run: npm run test:subpath
      - name: Build for the project subpath
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Smoke and accessibility tests
        run: npm run test:e2e
      - name: Lighthouse budgets
        run: npm run lhci
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
